<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#cfe8f8" id="metaTheme" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="description" content="Italia Scroll — Italian 3 trip through Italy. Pick the caption that fits the moment." />
  <meta property="og:title" content="Italia Scroll · Italiano 3" />
  <meta property="og:description" content="Vertical scroll through Italy. Choose the caption that fits — Bacoli to Braies." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://appuccinohub.github.io/italia-scroll/og.png" />
  <meta property="og:url" content="https://appuccinohub.github.io/italia-scroll/" />
  <meta name="twitter:card" content="summary_large_image" />
  <title>PREVIEW · Italia Scroll · Italiano 3</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css?v=14.4" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23cfe8f8'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-size='28'%3E%F0%9F%87%AE%F0%9F%87%B9%3C/text%3E%3C/svg%3E" />
  <style>
    /* PREVIEW-ONLY badge (lives in the header row, never over photos/videos) */
    .preview-badge { flex: 0 0 auto; display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 3px 8px; border-radius: 8px; background: #b00020; color: #fff; font-size: 9px; font-weight: 800; line-height: 1.15;
      letter-spacing: 0.02em; text-align: center; white-space: nowrap; pointer-events: none; }
    .preview-badge b { font-size: 10px; letter-spacing: 0.08em; }
    @media (min-width: 900px) { .preview-badge { flex-direction: row; gap: 6px; font-size: 11px; padding: 5px 10px; } .preview-badge b { font-size: 11px; } }
  </style>
</head>
<body>
  <div class="stage">
    <div class="phone app-shell" id="phone" role="application" aria-label="Italia Scroll">
      <header class="app-header">
        <button type="button" class="icon-btn" id="btnHome" aria-label="Home" title="Home" hidden>⌂</button>
        <div class="brand">
          <span class="logo" aria-hidden="true">🇮🇹</span>
          <div>
            <h1>Italia Scroll</h1>
            <p class="subtitle" id="headerSubtitle">For You · Italiano 3</p>
          </div>
        </div>
        <span class="preview-badge" role="note" aria-label="Preview, not the live version"><b>PREVIEW</b><span>– not the live version</span></span>
        <div class="header-actions">
          <button type="button" class="icon-btn" id="btnMute" aria-label="Mute sound" title="Sound">🔇</button>
          <button type="button" class="icon-btn" id="btnTheme" aria-label="Theme: Sky lemon. Tap for Fall" title="Theme">🍂</button>
        </div>
      </header>

      <!-- NAME -->
      <section class="screen" id="screenName" aria-label="Your name" hidden>
        <div class="name-card">
          <p class="name-emoji" aria-hidden="true">👋</p>
          <h2>Come ti chiami?</h2>
          <p class="name-hint">Type your first name so your teacher can see your work.</p>
          <label class="sr-only" for="studentName">First name</label>
          <input id="studentName" class="name-input" type="text" maxlength="40" autocomplete="given-name" placeholder="Your first name" />
          <button type="button" class="primary-btn" id="btnNameGo">Let’s go →</button>
        </div>
      </section>

      <!-- START -->
      <section class="screen active" id="screenStart" aria-label="Start">
        <div class="hero">
          <div class="hero-art" aria-hidden="true"></div>
          <p class="home-greet" id="homeGreet"></p>
          <div class="level-panel">
            <div class="level-list" id="levelList" role="list"></div>
          </div>
          <button type="button" class="quick-btn" id="btnQuick">⚡ Quick · 8</button>
          <button type="button" class="ghost-btn name-change" id="btnChangeName">Change name</button>
        </div>
      </section>

      <!-- PLAY -->
      <section class="screen" id="screenPlay" aria-label="Feed" hidden>
        <div class="play-meta">
          <p class="level-badge" id="levelBadge"></p>
          <p class="soft-score" id="softScore" aria-live="polite"></p>
        </div>
        <div class="feed" id="feed" tabindex="0" aria-label="Vertical card feed"></div>
        <div class="feed-nav">
          <button type="button" class="nav-btn" id="btnPrev" aria-label="Previous card">
            <span class="nav-arrow" aria-hidden="true">↑</span>
            <span class="nav-label">Up</span>
          </button>
          <span class="feed-pos" id="feedPos">1 / 15</span>
          <button type="button" class="nav-btn" id="btnNext" aria-label="Next card">
            <span class="nav-arrow" aria-hidden="true">↓</span>
            <span class="nav-label">Next</span>
          </button>
        </div>
      </section>

      <!-- END -->
      <section class="screen" id="screenEnd" aria-label="Done" hidden>
        <div class="end-card">
          <p class="end-emoji" aria-hidden="true">✨</p>
          <h2 id="endTitle">Fatto!</h2>
          <p class="end-score" id="endScore"></p>
          <p class="end-note" id="endNote"></p>
          <div class="end-actions">
            <button type="button" class="primary-btn" id="btnReplay">Rifai</button>
            <button type="button" class="secondary-btn" id="btnNextLevel" hidden>Next →</button>
            <button type="button" class="ghost-btn" id="btnBackHome">Home</button>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script src="data.js?v=14.4"></script>
  <script src="app.js?v=14.4"></script>
</body>
</html>
